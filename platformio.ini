; Show Jumping: an animated show jumping arena (horse and rider going round a course of fences) for the
; Freenove ESP32 Display 4.0" CYD (ESP32-32E, ST7796 480x320, resistive touch, no PSRAM).
; Board layer carried over from Deer Hunt. Build with `pio run -e cyd40` (default).
; Other boards (cyd28, cyd28usb2, freenove4, freenove28) can be added later the same way as in Deer Hunt.
[platformio]
boards_dir = boards
default_envs = cyd40

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git
    ; On-device WiFi picker (LVGL is only used until the arena is online)
    https://github.com/Grey-Lancaster/TouchWifiProvisioner.git#1.6.8
    https://github.com/ayushsharma82/ElegantOTA.git#00674c4656def54f7f96a142c26c1f044a63043b
    lvgl/lvgl@8.4.0
build_flags =
    -O2
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

; Freenove ESP32 Display 4.0" (FNK0114S / "FNK0103S" docs): plain ESP32-32E, ST7796 480x320, resistive XPT2046 touch,
; CYD pin layout (display on 13/12/14/2/15). Same settings as Deer Hunt's cyd40.
[env:cyd40]
board = esp32dev
board_build.partitions = boards/partitions_cyd.csv
build_flags =
    ${env.build_flags}
    -DBOARD_CYD28
    -DBOARD_CYD40
    -DST7796_DRIVER
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DSPI_TOUCH_FREQUENCY=2500000
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT
